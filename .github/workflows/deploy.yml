name: Auto Deploy Next.js to AWS EC2

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-to-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/acd-arc
            
            # Lưu lại mã commit trước khi pull để so sánh thay đổi
            OLD_COMMIT=$(git rev-parse HEAD)
            git pull origin main
            NEW_COMMIT=$(git rev-parse HEAD)
            
            # Chỉ chạy npm ci khi file package-lock.json có thay đổi
            if git diff --name-only $OLD_COMMIT $NEW_COMMIT | grep -q "package-lock.json"; then
              echo "Phat hien thay doi thu vien, dang chay npm ci..."
              npm ci --prefer-offline --no-audit
            fi
            
            # Chỉ chạy prisma generate khi file schema.prisma có thay đổi
            if git diff --name-only $OLD_COMMIT $NEW_COMMIT | grep -q "prisma/schema.prisma"; then
              echo "Phat hien thay doi Prisma schema, dang chay prisma generate..."
              npx prisma generate
            fi
            
            npm run build
            pm2 reload acd-web
          EOF
          rm -f private_key.pem
